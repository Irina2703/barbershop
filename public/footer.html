
      <footer class="contact-section">

        <div class="contact-photo">

          <img
            src="/assets/Rectangle_30"
            alt="Barber"
          />

        </div>


        <div class="contact-content">

          <h2 class="contact-content-h2" >Contact Us!</h2>


          <form  class="contactform" id="contactForm">

            <input class="contactform-input"
              type="text"
              id="name"
              placeholder="Enter your name"
              required
            />


            <input class="contactform-input"
              type="email"
              id="email"
              placeholder="Enter your email"
              required
            />


            <textarea class="contactform-textarea"
              id="message"
              placeholder="Your message"
              required
            ></textarea>


            <button class="contactForm-button" type="submit">
              Submit
            </button>

          </form>

        </div>

      </footer>
