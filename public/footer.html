
      <section class="contact-section">

        <div class="contact-photo">

          <img
            src="/assets/Rectangle_30"
            alt="Barber"
          />

        </div>


        <div class="contact-content">

          <h2>Contact Us!</h2>


          <form id="contactForm">

            <input
              type="text"
              id="name"
              placeholder="Enter your name"
              required
            />


            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              required
            />


            <textarea
              id="message"
              placeholder="Your message"
              required
            ></textarea>


            <button type="submit">
              Submit
            </button>

          </form>

        </div>

      </section>
